plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ftb.dev/releases"
            }
        }
        filter {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.architectury.dev/"
    }
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
            setIdeName("Neoforge Client (${project.path})")
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":commonApi").sourceSets.main
        }
    }
}

dependencies {
    jarJar(api project(":commonApi"))

    compileOnly "dev.ftb.mods:ftb-library-neoforge:$ftb_library_version"
    runtimeOnly "dev.ftb.mods:ftb-library-neoforge:$ftb_library_version"
    runtimeOnly "dev.ftb.mods:ftb-quests-neoforge:$ftb_quests_version"
    runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:$ftb_teams_version"
    runtimeOnly "dev.architectury:architectury-neoforge:$architectury_version"
}
