plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    jarJar(api project(":commonApi"))
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":commonApi").sourceSets.main
        }
        testmod {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            setIdeName("NeoForge Client (${project.path})")
            loadedMods = [mods."${mod_id}"]
        }
        testmodClient {
            client()
            gameDirectory = project.file('run/testmod')
            setIdeName("NeoForge Client Test (${project.path})")
            sourceSet = sourceSets.testmod
        }
    }
}
